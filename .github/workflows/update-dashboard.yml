name: Actualizar panel

on:
  schedule:
    # Cada 15 minutos, todo el dia
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credencial de Google
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: echo "$GA_SERVICE_ACCOUNT_JSON" > ga_credentials.json

      - name: Traer datos de Google Analytics
        continue-on-error: true
        env:
          GA_CRED_PATH: ga_credentials.json
        run: python scripts/fetch_ga.py

      - name: Traer datos de Meta Ads
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: python scripts/fetch_meta.py

      - name: Armar el panel
        run: python scripts/render_dashboard.py

      - name: Borrar credencial temporal
        if: always()
        run: rm -f ga_credentials.json

      - name: Commitear cambios
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add docs/index.html data/*.json
          git diff --quiet --cached || git commit -m "Actualizar panel automaticamente"
          git push
